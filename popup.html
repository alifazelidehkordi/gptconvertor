<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GPT Convertor</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <main>
    <header><h1>GPT Convertor</h1><p>Save ChatGPT in formats you can keep and edit.</p></header>
    <div id="status" role="status" aria-live="polite">Finding messages…</div>
    <label class="switch"><input type="checkbox" id="assistantOnly" checked><span>Assistant replies only</span></label>
    <section class="full-scan" aria-label="Long conversation capture">
      <div class="row">
        <button type="button" class="scan-button" id="scanAll" disabled>Scan entire conversation</button>
        <button type="button" class="plain" id="cancelScan" hidden aria-keyshortcuts="Escape">Cancel scan</button>
      </div>
      <p id="scanStatus" role="status" aria-live="polite">Only currently rendered messages are listed. Full scan temporarily scrolls this conversation.</p>
    </section>
    <section aria-labelledby="messageHeading">
      <div class="row"><strong id="messageHeading">Messages <span id="count" aria-live="polite" aria-atomic="true"></span></strong><button type="button" class="plain" id="toggleAll">Select all</button></div>
      <div id="messages" class="messages" role="group" aria-label="Conversation messages" aria-busy="false"></div>
    </section>
    <fieldset><legend>Export formats (choose several)</legend>
      <label><input type="checkbox" id="html" checked> Standalone HTML</label>
      <label><input type="checkbox" id="markdown" checked> Editable Markdown (.md)</label>
      <label><input type="checkbox" id="pdf" checked> PDF (Save as PDF)</label>
      <label><input type="checkbox" id="json"> Editable structured JSON</label>
    </fieldset>
    <button type="button" id="export" class="primary" disabled>Preview & export</button>
    <p class="fineprint">Processed locally. PDF opens Chrome's print dialog; no upload is performed.</p>
  </main>
  <script type="module" src="src/popup.js"></script>
</body></html>
